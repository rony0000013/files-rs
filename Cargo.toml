[package]
name = "files-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "files-gpui"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"
walkdir = "2.5.0"
async-trait = "0.1.92"
notify = "8.2.0"
dunce = "1.0.5"
directories = "6.0.0"
trash = "5.2.9"
jwalk = "0.9.0"
mime_guess = "2.0.5"
infer = "0.22.0"
bytesize = "2.7.0"
tracing = "0.1.44"
tracing-log = "0.2"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
fluent = "0.17.0"
sys-locale = "0.3.2"
window-vibrancy = "0.8.1"
suppaftp = { version = "12.2.0", features = ["tokio"] }
nucleo = "0.5.0"
lucide-rs = "0.1.0"
resvg = "0.48.1"
# Performance
rayon = "1.12"
memmap2 = "0.9"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
smallvec = "1.6"
uuid = { version = "1.28.0", features = ["v4"] }
open = "5"
zip = "9.0.3"
sevenz-rust = "0.6.1"
flate2 = "1.1"
bzip2 = "0.6"
zstd = "0.14"
lzma-rust2 = "0.22"
git2 = { version = "0.21.0", features = ["vendored-libgit2", "vendored-openssl"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rexif = "0.7.6"
id3 = "1.17.2"
dirs = "7.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff", "tga", "dds", "pnm", "hdr"] }
# Preview rendering crates
lopdf = "0.45"           # PDF metadata extraction
pdfium-render = "0.9"    # PDF page rasterization (bundled pdfium.dll via build.rs)
rodio = "0.23"             # Preview video audio output (pure-Rust decode chain via MF PCM)
betteroffice-docx = { version = "0.3", features = ["raster"] } # WYSIWYG DOCX pages: layout + raster to PNG
betteroffice-xlsx = "0.3" # WYSIWYG XLSX sheets: formatted grid + raster to PNG
betteroffice-pptx = { version = "0.3", features = ["raster"] } # WYSIWYG PPTX slides: layout + raster to PNG
quick-xml = "0.41"       # Office/EPUB XML text extraction (proper tag matching + entities)
raw-window-handle = "0.6"
sentry = "0.49"
sentry-tracing = "0.49"
gpui = "0.2.2"
lru = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System", "Win32_System_Threading",
    "Win32_Security", "Win32_UI_Shell", "Win32_System_SystemServices", "Win32_System_Com",
    "Win32_System_Registry", "Win32_System_Wmi", "Win32_System_SystemInformation",
    "Win32_UI_Shell_Common", "Win32_System_Memory", "Win32_System_DataExchange",
    "Win32_Security_Credentials",
    "Win32_System_Com_StructuredStorage", "Win32_System_Com_Marshal", "Win32_System_Variant",
    "Win32_System_Time",
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Ole",
] }

[dev-dependencies]
tempfile = "3.27.0"
html2text = "0.17.3"

# Fast GPUI build profiles: disable multi-GB PDB symbol generation and
# single-threaded LTO; parallel codegen units (matches Zed's release-fast setup).
[profile.dev]
debug = 0
strip = "debuginfo"
codegen-units = 16
incremental = true

[profile.test]
debug = 0
strip = "debuginfo"
codegen-units = 16
incremental = false

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = 0
strip = "symbols"

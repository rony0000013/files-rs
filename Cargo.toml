[package]
name = "files-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# ... (rest of dependencies)
tokio = { version = "1.52", features = ["full"] }
windows = { version = "0.52", features = [
    "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System", "Win32_System_Threading",
    "Win32_Security", "Win32_UI_Shell", "Win32_System_SystemServices", "Win32_System_Com",
    "Win32_System_Registry", "Win32_System_Wmi", "Win32_System_SystemInformation",
    "Win32_UI_Shell_Common", "Win32_System_Memory", "Win32_System_DataExchange",
    "Win32_Security_Credentials",
    "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
    "Win32_System_Time",
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.5.0"
async-trait = "0.1.89"
notify = "8.2.0"
dunce = "1.0.5"
directories = "6.0.0"
trash = "5.2.5"
jwalk = "0.8.1"
mime_guess = "2.0.5"
infer = "0.19.0"
bytesize = "2.3.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
fluent = "0.17.0"
sys-locale = "0.3.2"
window-vibrancy = "0.7.1"
suppaftp = { version = "8.0.3", features = ["tokio"] }
nucleo = "0.5.0"
lucide-rs = "0.1.0"
resvg = "0.47.0"
# Performance
rayon = "1.10"
memmap2 = "0.9"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
uuid = { version = "1.23.1", features = ["v4"] }
zip = "8.6.0"
sevenz-rust = "0.6.1"
git2 = { version = "0.20.4", features = ["vendored-libgit2", "vendored-openssl"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rexif = "0.7.5"
id3 = "1.16.4"
dirs = "6.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# Preview rendering crates
lopdf = "0.31"           # PDF metadata extraction
raw-window-handle = "0.6"
sentry = "0.34"
sentry-tracing = "0.34"
gpui = "0.2.2"
lru = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3.27.0"
html2text = "0.17.1"
